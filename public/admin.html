<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UbicacionGPS | Administración</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif !important;
        }

        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #f4f4f4;
            color: #263238;
        }

        #map {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .admin-panel {
            position: fixed;
            top: 14px;
            bottom: 14px;
            left: 14px;
            z-index: 1000;
            display: flex;
            width: min(380px, calc(100vw - 28px));
            flex-direction: column;
            padding: 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
        }

        .panel-header {
            flex: 0 0 auto;
        }

        .panel-header h1 {
            margin: 0 0 12px;
            font-size: 20px;
        }

        .panel-actions,
        .tools-row,
        .user-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-actions {
            justify-content: space-between;
            margin-bottom: 9px;
        }

        .tools-row {
            margin-bottom: 9px;
        }

        .online-count {
            padding: 8px 10px;
            border-radius: 999px;
            background: #43a047;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        button {
            border: 0;
            border-radius: 7px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        .show-all,
        .search-button {
            padding: 9px 11px;
        }

        .show-all {
            background: #43a047;
        }

        .show-all:hover {
            background: #388e3c;
        }

        .search-form {
            display: flex;
            width: 100%;
            gap: 7px;
        }

        .search-input {
            min-width: 0;
            flex: 1;
            padding: 9px 10px;
            border: 1px solid #cfd8dc;
            border-radius: 7px;
            font-size: 14px;
        }

        .search-input:focus {
            outline: 2px solid rgba(30, 136, 229, 0.2);
            border-color: #1e88e5;
        }

        .search-button {
            background: #1e88e5;
        }

        .search-button:hover {
            background: #1565c0;
        }

        .connection-status {
            min-height: 18px;
            margin: 0 0 8px;
            color: #607d8b;
            font-size: 13px;
        }

        .sos-banner {
            position: fixed;
            top: 14px;
            left: 50%;
            z-index: 1200;
            max-width: calc(100vw - 28px);
            padding: 14px 22px;
            transform: translateX(-50%);
            border-radius: 8px;
            background: #c62828;
            color: #fff;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            animation: alert-flash 1s infinite alternate;
        }

        [hidden] {
            display: none !important;
        }

        .user-list {
            min-height: 0;
            flex: 1;
            overflow-y: auto;
            padding-right: 3px;
        }

        .user-card {
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 8px;
            background: #f5f5f5;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .user-id {
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
        }

        .user-detail {
            margin: 4px 0;
            color: #546e7a;
        }

        .user-actions {
            margin-top: 8px;
        }

        .user-actions button {
            flex: 1;
            padding: 7px 8px;
            font-size: 12px;
        }

        .center-user {
            background: #1e88e5;
        }

        .route-user {
            background: #43a047;
        }

        .center-user:hover {
            background: #1565c0;
        }

        .route-user:hover {
            background: #388e3c;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .empty-list {
            padding: 10px 4px;
            color: #607d8b;
            font-size: 13px;
        }

        .notifications {
            display: flex;
            max-height: 190px;
            flex: 0 0 auto;
            flex-direction: column;
            margin-top: 9px;
            padding-top: 9px;
            border-top: 1px solid #dce3e7;
        }

        .notifications h2 {
            margin: 0 0 7px;
            font-size: 15px;
        }

        .notification-list {
            min-height: 44px;
            overflow-y: auto;
        }

        .notification-item {
            margin-bottom: 6px;
            padding: 8px;
            border-radius: 7px;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 12px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .notification-item.sos {
            background: #ffebee;
            color: #b71c1c;
            font-weight: 700;
        }

        .sos-marker-pulse {
            width: 24px;
            height: 24px;
            border: 4px solid #fff;
            border-radius: 50%;
            background: #e53935;
            box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.75);
            animation: marker-pulse 1s infinite;
        }

        @keyframes marker-pulse {
            0% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.75); }
            100% { box-shadow: 0 0 0 14px rgba(229, 57, 53, 0); }
        }

        @keyframes alert-flash {
            from { background: #c62828; }
            to { background: #ef5350; }
        }

        @media (max-width: 520px) {
            .admin-panel {
                top: 8px;
                bottom: 8px;
                left: 8px;
                width: min(360px, calc(100vw - 16px));
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <aside class="admin-panel">
        <div class="panel-header">
            <h1>UbicacionGPS · Admin</h1>
            <div class="panel-actions">
                <span class="online-count" id="online-count">0 usuarios en línea</span>
                <button class="show-all" id="show-all" type="button">Ver todos</button>
            </div>
            <form class="tools-row search-form" id="address-search-form">
                <input class="search-input" id="address-search" type="search" placeholder="Buscar dirección" aria-label="Dirección para geocerca" required>
                <button class="search-button" id="search-button" type="submit">Buscar</button>
            </form>
            <p class="connection-status" id="connection-status" aria-live="polite">Conectando al servidor...</p>
            <div class="sos-banner" id="sos-banner" role="alert" hidden></div>
        </div>
        <div class="user-list" id="user-list" aria-live="polite">
            <div class="empty-list">Esperando usuarios...</div>
        </div>
        <section class="notifications" aria-label="Notificaciones">
            <h2>Notificaciones</h2>
            <div class="notification-list" id="notification-list" aria-live="polite">
                <div class="empty-list">Sin notificaciones.</div>
            </div>
        </section>
    </aside>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const socket = io(window.location.origin, { auth: { isAdmin: true } });
        const users = new Map();
        const markers = new Map();
        const geofences = new Map();
        const geofenceLayers = new Map();
        const notifications = document.getElementById('notification-list');
        const list = document.getElementById('user-list');
        const count = document.getElementById('online-count');
        const status = document.getElementById('connection-status');
        const sosBanner = document.getElementById('sos-banner');
        let activeRoute = null;
        let temporarySearchMarker = null;
        let temporaryMarkerTimeout = null;

        function hasLocation(user) {
            return Number.isFinite(user.lastLat) && Number.isFinite(user.lastLng);
        }

        function formatLastUpdate(value) {
            return value ? new Date(value).toLocaleString('es') : 'Sin ubicación recibida';
        }

        function addNotification(message, type = '') {
            const empty = notifications.querySelector('.empty-list');
            if (empty) {
                empty.remove();
            }
            const item = document.createElement('div');
            item.className = `notification-item ${type}`.trim();
            item.textContent = message;
            notifications.prepend(item);
            while (notifications.children.length > 50) {
                notifications.lastElementChild.remove();
            }
        }

        function markerIcon(user) {
            return user.sosActive
                ? L.divIcon({
                    className: '',
                    html: '<div class="sos-marker-pulse"></div>',
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                })
                : new L.Icon.Default();
        }

        function renderUsers() {
            count.textContent = `${users.size} ${users.size === 1 ? 'usuario en línea' : 'usuarios en línea'}`;
            list.replaceChildren();

            if (users.size === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-list';
                empty.textContent = 'No hay usuarios conectados.';
                list.appendChild(empty);
                return;
            }

            Array.from(users.values())
                .sort((first, second) => first.socketId.localeCompare(second.socketId))
                .forEach((user) => {
                    const card = document.createElement('article');
                    card.className = 'user-card';

                    const id = document.createElement('div');
                    id.className = 'user-id';
                    id.textContent = user.socketId;

                    const room = document.createElement('div');
                    room.className = 'user-detail';
                    room.textContent = `Sala: ${user.roomCode}`;

                    const updated = document.createElement('div');
                    updated.className = 'user-detail';
                    updated.textContent = `Última actualización: ${formatLastUpdate(user.lastUpdate)}`;

                    const actions = document.createElement('div');
                    actions.className = 'user-actions';

                    const center = document.createElement('button');
                    center.className = 'center-user';
                    center.type = 'button';
                    center.textContent = 'Centrar';
                    center.disabled = !hasLocation(user);
                    center.addEventListener('click', () => {
                        if (hasLocation(user)) {
                            map.setView([user.lastLat, user.lastLng], 16);
                        }
                    });

                    const route = document.createElement('button');
                    route.className = 'route-user';
                    route.type = 'button';
                    route.textContent = 'Ver Ruta';
                    route.disabled = !user.history || user.history.length === 0;
                    route.addEventListener('click', () => showRoute(user));

                    actions.append(center, route);
                    card.append(id, room, updated, actions);
                    list.appendChild(card);
                });
        }

        function updateUser(user) {
            const previous = users.get(user.socketId);
            const updatedUser = {
                ...previous,
                ...user,
                sosActive: user.sosActive || previous?.sosActive || false
            };
            users.set(user.socketId, updatedUser);

            if (hasLocation(updatedUser)) {
                const position = [updatedUser.lastLat, updatedUser.lastLng];
                if (markers.has(updatedUser.socketId)) {
                    markers.get(updatedUser.socketId)
                        .setLatLng(position)
                        .setIcon(markerIcon(updatedUser));
                } else {
                    markers.set(updatedUser.socketId, L.marker(position, {
                        icon: markerIcon(updatedUser)
                    }).addTo(map));
                }
            }
            renderUsers();
        }

        function removeUser(socketId) {
            users.delete(socketId);
            if (markers.has(socketId)) {
                map.removeLayer(markers.get(socketId));
                markers.delete(socketId);
            }
            renderUsers();
        }

        function addGeofence(geofence) {
            geofences.set(geofence.id, geofence);
            if (!geofenceLayers.has(geofence.id)) {
                geofenceLayers.set(geofence.id, L.circle([geofence.lat, geofence.lng], {
                    radius: geofence.radius,
                    color: '#1e88e5',
                    fillColor: '#1e88e5',
                    fillOpacity: 0.14,
                    weight: 2
                }).addTo(map).bindPopup(`${geofence.name} · ${geofence.radius} m`));
            }
        }

        function showRoute(user) {
            const points = (user.history || []).map((point) => [point.lat, point.lng]);
            if (points.length === 0) {
                return;
            }
            if (activeRoute) {
                map.removeLayer(activeRoute);
            }
            activeRoute = L.polyline(points, {
                color: '#43a047',
                weight: 5,
                opacity: 0.85
            }).addTo(map);
            if (points.length === 1) {
                map.setView(points[0], 16);
            } else {
                map.fitBounds(activeRoute.getBounds(), { padding: [35, 35], maxZoom: 16 });
            }
        }

        document.getElementById('show-all').addEventListener('click', () => {
            const locatedMarkers = Array.from(markers.values());
            if (locatedMarkers.length === 1) {
                map.setView(locatedMarkers[0].getLatLng(), 16);
            } else if (locatedMarkers.length > 1) {
                const bounds = L.latLngBounds(locatedMarkers.map((marker) => marker.getLatLng()));
                map.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 });
            }
        });

        document.getElementById('address-search-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const searchInput = document.getElementById('address-search');
            const searchButton = document.getElementById('search-button');
            const address = searchInput.value.trim();
            if (!address) {
                return;
            }

            searchButton.disabled = true;
            status.textContent = 'Buscando dirección...';
            try {
                const response = await fetch(
                    'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(address)
                );
                if (!response.ok) {
                    throw new Error(`Error del servicio de búsqueda (${response.status}).`);
                }

                const results = await response.json();
                if (!Array.isArray(results) || results.length === 0) {
                    status.textContent = 'No se encontró esa dirección.';
                    return;
                }

                const result = results[0];
                const lat = Number(result.lat);
                const lng = Number(result.lon);
                if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
                    throw new Error('El servicio devolvió coordenadas no válidas.');
                }

                const position = [lat, lng];
                map.setView(position, 16);
                if (temporaryMarkerTimeout !== null) {
                    window.clearTimeout(temporaryMarkerTimeout);
                }
                if (temporarySearchMarker) {
                    map.removeLayer(temporarySearchMarker);
                }
                temporarySearchMarker = L.marker(position)
                    .addTo(map)
                    .bindPopup(result.display_name || address)
                    .openPopup();
                const markerToRemove = temporarySearchMarker;
                temporaryMarkerTimeout = window.setTimeout(() => {
                    if (temporarySearchMarker === markerToRemove) {
                        map.removeLayer(markerToRemove);
                        temporarySearchMarker = null;
                        temporaryMarkerTimeout = null;
                    }
                }, 10000);

                const radiusInput = window.prompt('Radio de la geocerca en metros:', '200');
                if (radiusInput === null) {
                    status.textContent = 'Búsqueda completada; no se creó una geocerca.';
                    return;
                }
                const radius = Number(radiusInput);
                if (!Number.isFinite(radius) || radius <= 0) {
                    status.textContent = 'Ingresa un radio válido, mayor que cero.';
                    return;
                }

                const name = (result.display_name || address).split(',')[0].trim() || address;
                socket.emit('save-geofence', { name, lat, lng, radius }, (saveResult) => {
                    status.textContent = saveResult?.ok
                        ? `Geocerca "${name}" guardada.`
                        : (saveResult?.error || 'No se pudo guardar la geocerca.');
                });
            } catch (error) {
                status.textContent = `No se pudo buscar la dirección: ${error.message}`;
            } finally {
                searchButton.disabled = false;
            }
        });

        socket.on('connect', () => {
            socket.emit('join-admin', (result) => {
                if (!result || !result.ok) {
                    status.textContent = 'La sesión de administrador no es válida. Vuelve a iniciar sesión.';
                    socket.disconnect();
                    return;
                }
                status.textContent = 'Panel conectado en tiempo real.';
            });
        });

        socket.on('admin-init', (initialData) => {
            users.clear();
            markers.forEach((marker) => map.removeLayer(marker));
            markers.clear();
            geofenceLayers.forEach((layer) => map.removeLayer(layer));
            geofenceLayers.clear();
            geofences.clear();
            (initialData.users || []).forEach(updateUser);
            (initialData.geofences || []).forEach(addGeofence);
            renderUsers();
        });

        socket.on('admin-update', updateUser);
        socket.on('admin-user-left', removeUser);

        socket.on('geofence-added', addGeofence);

        socket.on('geofence-alert', (alert) => {
            const userName = alert.userName || alert.socketId;
            addNotification(`${userName} ${alert.action} de la zona "${alert.name}".`);
        });

        socket.on('sos-alert', (alert) => {
            console.log('Alerta SOS recibida:', alert);
            const user = users.get(alert.socketId) || {
                socketId: alert.socketId,
                roomCode: 'global',
                history: []
            };
            user.lastLat = Number.isFinite(alert.lat) ? alert.lat : alert.lastLat;
            user.lastLng = Number.isFinite(alert.lng) ? alert.lng : alert.lastLng;
            user.lastUpdate = alert.lastUpdate;
            user.sosActive = true;
            updateUser(user);
            sosBanner.textContent = `¡ALERTA SOS! Usuario: ${alert.socketId}`;
            sosBanner.hidden = false;
            if (hasLocation(user)) {
                map.setView([user.lastLat, user.lastLng], 16);
            }
            addNotification(`¡ALERTA SOS! Usuario: ${alert.socketId}`, 'sos');
        });

        socket.on('connect_error', () => {
            status.textContent = 'Error de autenticación. Verifica tu clave.';
        });

        socket.on('disconnect', () => {
            status.textContent = 'Conexión perdida. Intentando reconectar...';
        });
    </script>
</body>
</html>
