services:
  - type: web
    name: ubicaciongps
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:frontend
    startCommand: node app.js
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@ubicaciongps.com
      - key: GEOAPIFY_API_KEY
        sync: false
